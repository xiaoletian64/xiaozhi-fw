name: Build ESP32 firmware
on:
  workflow_dispatch:
    inputs:
      board:
        description: Kconfig BOARD_TYPE symbol (w/o CONFIG_ prefix)
        required: true
        default: BOARD_TYPE_LICHUANG_DEV_S3
        type: string
      target:
        description: IDF target chip
        required: true
        default: esp32s3
        type: choice
        options: [esp32s3, esp32c3, esp32c6]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 铁律：action 一律钉 SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build in official IDF image
        env:
          BOARD: ${{ inputs.board }}
          TARGET: ${{ inputs.target }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BOARD="${BOARD:-BOARD_TYPE_LICHUANG_DEV_S3}" -e TARGET="${TARGET:-esp32s3}" \
            espressif/idf:v5.5.2 bash -c '
              set -e
              . $IDF_PATH/export.sh
              # xiaozhi 的板子由 Kconfig CONFIG_BOARD_TYPE_* 决定；板符号 depends on 芯片，
              # 必须先钉 IDF_TARGET 再注入 overlay，否则符号不可见被静默忽略（踩过：回落 esp32 默认板）
              printf "CONFIG_%s=y\n" "$BOARD" > sdkconfig.board-overlay
              idf.py -DIDF_TARGET=$TARGET \
                     -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.$TARGET;sdkconfig.board-overlay" \
                     -B build build'

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/xiaozhi.bin out/
          cp build/bootloader/bootloader.bin out/
          cp build/partition_table/partition-table.bin out/
          cp build/ota_data_initial.bin out/ 2>/dev/null || true
          cp build/flasher_args.json out/ 2>/dev/null || true
          cd out
          sha256sum * | tee SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp-fw-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
